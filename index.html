<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Football Fine Calculator</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%237c3aed'/%3E%3Ccircle cx='90' cy='90' r='58' fill='white' stroke='%235b21b6' stroke-width='3'/%3E%3Cpolygon points='90,45 103,78 138,78 111,99 121,132 90,112 59,132 69,99 42,78 77,78' fill='%231a1a2e' opacity='0.85'/%3E%3Ccircle cx='90' cy='90' r='58' fill='none' stroke='%235b21b6' stroke-width='3'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%237c3aed'/%3E%3Ccircle cx='90' cy='90' r='58' fill='white' stroke='%235b21b6' stroke-width='3'/%3E%3Cpolygon points='90,45 103,78 138,78 111,99 121,132 90,112 59,132 69,99 42,78 77,78' fill='%231a1a2e' opacity='0.85'/%3E%3Ccircle cx='90' cy='90' r='58' fill='none' stroke='%235b21b6' stroke-width='3'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="Fine Calc">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #a855f7;
    --purple-dark: #7c3aed;
    --purple-glow: rgba(168,85,247,0.45);
    --gold: #f59e0b;
    --red: #ef4444;
    --green: #22c55e;
    --bg-overlay: rgba(0,0,0,0.72);
    --card: rgba(15,10,30,0.82);
    --border: rgba(168,85,247,0.55);
    --text: #f1f0ff;
    --sub: #c4b5fd;
  }

  html, body {
    min-height: 100%;
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  body {
    background: #000 url('/mnt/user-data/uploads/n7k9ds.webp') center center / cover no-repeat fixed;
    min-height: 100vh;
    padding: 0;
  }

  .overlay {
    min-height: 100vh;
    background: var(--bg-overlay);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 8vw, 3rem);
    letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 0 24px var(--purple-glow), 0 2px 8px #000;
    line-height: 1.1;
  }
  .header h1 span { color: var(--purple); }
  .header p {
    font-size: 0.95rem;
    color: var(--sub);
    margin-top: 4px;
    letter-spacing: 1px;
    font-weight: 500;
  }

  /* CARD */
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 22px 20px;
    box-shadow: 0 0 32px rgba(168,85,247,0.18), 0 8px 32px rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* SECTION LABEL */
  .section-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 2px;
    color: var(--purple);
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  /* FIELD */
  .field-group { margin-bottom: 18px; }
  .field-label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--sub);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    display: block;
  }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 60px 12px 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }
  .input-wrap input:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(168,85,247,0.2);
  }
  .input-wrap input::placeholder { color: rgba(255,255,255,0.3); font-weight: 400; }
  .input-unit {
    position: absolute;
    right: 12px;
    font-size: 0.78rem;
    color: var(--purple);
    font-weight: 600;
    pointer-events: none;
    letter-spacing: 0.5px;
  }

  /* DIVIDER */
  .divider {
    border: none;
    border-top: 1px solid rgba(168,85,247,0.2);
    margin: 18px 0;
  }

  /* COUNTER ROW */
  .counter-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
  }
  .counter-label {
    flex: 1;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--sub);
    line-height: 1.3;
  }
  .counter-label span {
    display: block;
    font-size: 0.72rem;
    font-weight: 500;
    color: rgba(196,181,253,0.6);
  }
  .counter-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    margin-top: -6px;
  }
  .counter-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: rgba(168,85,247,0.15);
    color: var(--purple);
    font-size: 1.3rem;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    font-weight: 700;
  }
  .counter-btn:active { background: rgba(168,85,247,0.35); transform: scale(0.93); }
  .counter-input {
    width: 52px;
    height: 34px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.2s;
  }
  .counter-input:focus { border-color: var(--purple); }

  /* BADGE */
  .pct-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .badge-2 { background: rgba(34,197,94,0.18); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
  .badge-4 { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
  .badge-6 { background: rgba(239,68,68,0.18); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

  /* ERROR */
  .error-msg {
    display: none;
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.4);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.88rem;
    color: #fca5a5;
    margin-bottom: 14px;
    font-weight: 600;
    text-align: center;
  }
  .error-msg.show { display: block; }

  /* BUTTON */
  .btn-generate {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--purple-dark), var(--purple));
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 3px;
    cursor: pointer;
    margin-top: 6px;
    box-shadow: 0 4px 20px rgba(168,85,247,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-generate:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(168,85,247,0.3); }

  /* RESULTS */
  .results-card {
    display: none;
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 22px 20px;
    box-shadow: 0 0 32px rgba(168,85,247,0.18), 0 8px 32px rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: fadeUp 0.4s ease;
  }
  .results-card.show { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .results-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 3px;
    color: #fff;
    text-align: center;
    margin-bottom: 18px;
    text-shadow: 0 0 16px var(--purple-glow);
  }

  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 14px;
    border-radius: 11px;
    margin-bottom: 10px;
    border: 1px solid transparent;
    transition: transform 0.15s;
  }
  .result-row:last-child { margin-bottom: 0; }

  .result-row.base { background: rgba(168,85,247,0.1); border-color: rgba(168,85,247,0.25); }
  .result-row.fine-2 { background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.2); }
  .result-row.fine-4 { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.2); }
  .result-row.fine-6 { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.2); }

  .result-label { font-size: 0.85rem; font-weight: 600; color: var(--sub); }
  .result-label strong { display: block; font-size: 0.78rem; font-weight: 500; color: rgba(196,181,253,0.6); margin-top: 1px; }
  .result-amount { font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem; letter-spacing: 1px; }
  .result-amount .unit { font-family: 'Rajdhani', sans-serif; font-size: 0.75rem; font-weight: 600; color: var(--sub); margin-left: 3px; }

  .result-row.base .result-amount { color: var(--purple); }
  .result-row.fine-2 .result-amount { color: #4ade80; }
  .result-row.fine-4 .result-amount { color: #fbbf24; }
  .result-row.fine-6 .result-amount { color: #f87171; }

  .btn-back {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--purple);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 2px;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-back:active { background: rgba(168,85,247,0.12); }

  .result-single {
    text-align: center;
    padding: 18px 14px;
    background: rgba(168,85,247,0.1);
    border: 1px solid rgba(168,85,247,0.25);
    border-radius: 11px;
    margin-bottom: 10px;
  }
  .result-single .label { font-size: 0.85rem; color: var(--sub); font-weight: 600; margin-bottom: 6px; }
  .result-single .amount { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--purple); letter-spacing: 2px; }
  .result-single .unit { font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; color: var(--sub); margin-left: 4px; }
</style>
</head>
<body>
<div class="overlay">
  <div class="header">
    <h1>⚽ FINE <span>CALCULATOR</span></h1>
    <p>Football Session · Late Penalty System</p>
  </div>

  <!-- INPUT CARD -->
  <div class="card" id="inputCard">

    <div class="section-label">Session Info</div>

    <div class="field-group">
      <label class="field-label">Session Cost (قیمت فوتبال)</label>
      <div class="input-wrap">
        <input type="text" id="totalCost" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 3,000,000">
        <span class="input-unit">تومان</span>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">Number of Players (تعداد بازیکنان)</label>
      <div class="input-wrap">
        <input type="number" id="playerCount" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 10" min="1">
      </div>
    </div>

    <hr class="divider">
    <div class="section-label">Late Arrivals</div>

    <!-- 2% -->
    <div class="counter-row">
      <div class="counter-label">
        <span class="pct-badge badge-2">2%</span> Late Players
        <span>تعداد تاخیری‌های ۲ درصدی</span>
      </div>
      <div class="counter-controls">
        <button class="counter-btn" onclick="adjust('fine2',-1)">−</button>
        <input class="counter-input" type="number" id="fine2" inputmode="numeric" value="0" min="0">
        <button class="counter-btn" onclick="adjust('fine2',1)">+</button>
      </div>
    </div>

    <!-- 4% -->
    <div class="counter-row">
      <div class="counter-label">
        <span class="pct-badge badge-4">4%</span> Late Players
        <span>تعداد تاخیری‌های ۴ درصدی</span>
      </div>
      <div class="counter-controls">
        <button class="counter-btn" onclick="adjust('fine4',-1)">−</button>
        <input class="counter-input" type="number" id="fine4" inputmode="numeric" value="0" min="0">
        <button class="counter-btn" onclick="adjust('fine4',1)">+</button>
      </div>
    </div>

    <!-- 6% -->
    <div class="counter-row">
      <div class="counter-label">
        <span class="pct-badge badge-6">6%</span> Late Players
        <span>تعداد تاخیری‌های ۶ درصدی</span>
      </div>
      <div class="counter-controls">
        <button class="counter-btn" onclick="adjust('fine6',-1)">−</button>
        <input class="counter-input" type="number" id="fine6" inputmode="numeric" value="0" min="0">
        <button class="counter-btn" onclick="adjust('fine6',1)">+</button>
      </div>
    </div>

    <div class="error-msg" id="errorMsg">⚠️ Please fill in all required fields to continue.</div>

    <button class="btn-generate" onclick="calculate()">GENERATE RESULTS</button>
  </div>

  <!-- RESULTS CARD -->
  <div class="results-card" id="resultsCard">
    <div class="results-title">📊 RESULTS</div>
    <div id="resultsContent"></div>
    <button class="btn-back" onclick="goBack()">← BACK</button>
  </div>

</div>

<script>
  // prevent letters in number inputs
  document.querySelectorAll('input[type=number]').forEach(inp => {
    inp.addEventListener('keypress', e => {
      if (!/[0-9]/.test(e.key)) e.preventDefault();
    });
  });

  // comma formatting for cost field
  const costInput = document.getElementById('totalCost');
  costInput.addEventListener('input', function() {
    let raw = this.value.replace(/[^0-9]/g, '');
    if (raw === '') { this.value = ''; return; }
    this.value = parseInt(raw, 10).toLocaleString('en-US');
  });
  costInput.addEventListener('keypress', function(e) {
    if (!/[0-9]/.test(e.key)) e.preventDefault();
  });

  function adjust(id, delta) {
    const el = document.getElementById(id);
    let v = parseInt(el.value) || 0;
    v = Math.max(0, v + delta);
    el.value = v;
  }

  function fmt(n) {
    return Math.round(n).toLocaleString('fa-IR');
  }

  function calculate() {
    const errEl = document.getElementById('errorMsg');
    errEl.classList.remove('show');

    let cost = parseFloat(document.getElementById('totalCost').value.replace(/,/g, ''));
    const players = parseInt(document.getElementById('playerCount').value);

    if (!cost || !players || players < 1) {
      errEl.classList.add('show');
      return;
    }

    // auto-multiply if < 10000
    if (cost < 10000) cost = cost * 1000;

    const n2 = Math.max(0, parseInt(document.getElementById('fine2').value) || 0);
    const n4 = Math.max(0, parseInt(document.getElementById('fine4').value) || 0);
    const n6 = Math.max(0, parseInt(document.getElementById('fine6').value) || 0);
   
    const totalLate = n2 + n4 + n6;
    if (players > 30) {
      errEl.textContent = '⚠️ Maximum number of players is 30.';
      errEl.classList.add('show');
      return;
    }

    if (totalLate > players) {
      errEl.textContent = '⚠️ Total late players cannot be more than total players.';
      errEl.classList.add('show');
      return;
    }
    const allZero = (n2 === 0 && n4 === 0 && n6 === 0);
    
    let html = '';

    if (allZero) {
      // No fines: just divide
      const perPlayer = cost / players;
      html = `
        <div class="result-single">
          <div class="label">Price per Player (no fines)</div>
          <div class="amount">${fmt(perPlayer)}<span class="unit">تومان</span></div>
        </div>`;
    } else {
      // Total fine percentage pool
      const totalFinePool = (n2 * 0.02 + n4 * 0.04 + n6 * 0.06) * cost;
      // Base cost after removing fines
      const baseCost = cost - totalFinePool;
      const basePerPlayer = baseCost / players;

      html += `<div class="result-row base">
        <div class="result-label">Base Price (no fine)<strong>قیمت بدون جریمه</strong></div>
        <div class="result-amount">${fmt(basePerPlayer)}<span class="unit">تومان</span></div>
      </div>`;

      if (n2 > 0) {
        const fine2Pay = basePerPlayer + cost * 0.02;
        html += `<div class="result-row fine-2">
          <div class="result-label">2% Late Player Price<strong>قیمت تاخیری ۲٪</strong></div>
          <div class="result-amount">${fmt(fine2Pay)}<span class="unit">تومان</span></div>
        </div>`;
      }

      if (n4 > 0) {
        const fine4Pay = basePerPlayer + cost * 0.04;
        html += `<div class="result-row fine-4">
          <div class="result-label">4% Late Player Price<strong>قیمت تاخیری ۴٪</strong></div>
          <div class="result-amount">${fmt(fine4Pay)}<span class="unit">تومان</span></div>
        </div>`;
      }

      if (n6 > 0) {
        const fine6Pay = basePerPlayer + cost * 0.06;
        html += `<div class="result-row fine-6">
          <div class="result-label">6% Late Player Price<strong>قیمت تاخیری ۶٪</strong></div>
          <div class="result-amount">${fmt(fine6Pay)}<span class="unit">تومان</span></div>
        </div>`;
      }
    }

    document.getElementById('resultsContent').innerHTML = html;
    document.getElementById('inputCard').style.display = 'none';
    const rc = document.getElementById('resultsCard');
    rc.classList.add('show');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goBack() {
    document.getElementById('resultsCard').classList.remove('show');
    document.getElementById('inputCard').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
